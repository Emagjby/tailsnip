[package]
name = "tailsnip"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
constant_time_eq = "0.4"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.0.7"

[dev-dependencies]
tempfile = "3.27.0"
